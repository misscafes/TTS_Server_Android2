# CNB云原生开发配置
# 用于构建Android TTS Server项目

**:
  # 点击仓库页面"云原生开发"按钮时触发
  vscode:
    - name: android-dev-env
      runner:
        # Android构建需要较多资源，分配8核16GB
        cpus: 8
      docker:
        # 使用自定义Dockerfile构建环境
        build: .ide/Dockerfile
      services:
        - vscode
        - docker
      # 启动环境后执行的任务
      stages:
        - name: 检查环境
          script:
            - echo "Java version:"
            - java -version
            - echo "Android SDK location:"
            - echo $ANDROID_HOME
            - echo "Gradle version:"
            - ./gradlew --version
        - name: 检查签名配置
          script:
            - echo "检查local.properties是否存在"
            - if [ -f local.properties ]; then echo "签名配置已就绪"; cat local.properties; else echo "警告：未找到local.properties文件，请先配置签名"; fi
      # 开发环境销毁前执行的任务（可选）
      endStages:
        - name: 清理构建缓存
          script: |
            echo "开发环境即将关闭"
            # 可选：清理Gradle缓存以节省空间
            # ./gradlew clean
